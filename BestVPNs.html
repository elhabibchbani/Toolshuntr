    <style>
        @keyframes floating {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-15px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .floating-4 {
            animation: floating 4s ease-in-out infinite;
        }

        .bg-cream {

<body class="antialiased">

    <div x-data="{ open: false, atTop: true }" @scroll.window="atTop = (window.pageYOffset > 50) ? false : true"
        :class="{ 'bg-white shadow-lg py-2': !atTop, 'bg-cream py-6': atTop }"
        class="fixed top-0 left-0 right-0 w-full text-gray-700 z-[100] transition-all duration-300">
        <div class="flex flex-col max-w-screen-xl px-8 mx-auto md:items-center md:justify-between md:flex-row">

                            fill="#65DAFF" />
                    </svg>
                </div>
                <button class="rounded-lg md:hidden focus:outline-none focus:shadow-outline" @click="open = !open">

                <a class="px-4 py-2 mt-2 text-sm font-semibold bg-transparent rounded-lg md:mt-0 md:ml-4 hover:text-blue-500 transition-colors"
                    href="./index.html">Home</a>

                        x-transition:leave-start="transform opacity-100 scale-100"

                        class="absolute right-0 w-full mt-2 origin-top-right rounded-md shadow-lg md:w-48 z-30">
                        <div class="px-2 py-2 bg-white rounded-md shadow-xl border border-gray-100">
                            <a class="block px-4 py-2 text-sm font-semibold bg-transparent rounded-lg hover:bg-gray-100 transition-colors"

                                href="./Streaming/VPNForGaming.html">VPN for Gaming</a>

                    </div>
                </div>

                    href="./Products.html">Products</a>
                <a class="px-4 py-2 mt-2 text-sm font-semibold bg-transparent rounded-lg md:mt-0 md:ml-4 hover:text-blue-500 transition-colors"
                    href="./Blog">Blog</a>
                <a class="px-4 py-2 mt-2 text-sm font-semibold bg-transparent rounded-lg md:mt-0 md:ml-4 hover:text-blue-500 transition-colors"
                    href="./AboutUs.html">About Us</a>

                <div class="relative md:ml-4" x-data="{ openLang: false }">
                    <button @click="openLang = !openLang" @click.away="openLang = false"
                        class="flex flex-row items-center w-full px-4 py-2 mt-2 text-sm font-bold text-left bg-transparent rounded-lg md:w-auto md:inline md:mt-0 hover:text-blue-500 transition-colors focus:outline-none uppercase">
                        <span>EN</span>
                        <svg fill="currentColor" viewBox="0 0 20 20"
                            :class="{'rotate-180': openLang, 'rotate-0': !openLang}"
                            class="inline w-4 h-4 mt-1 ml-1 transition-transform duration-200 transform md:-mt-1">
                            <path fill-rule="evenodd"
                                d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                                clip-rule="evenodd"></path>
                        </svg>
                    </button>
                    <div x-show="openLang" x-transition style="display: none;"

                        <div class="px-2 py-2 bg-white rounded-md shadow-xl border border-gray-100">
                            <a class="block px-4 py-2 text-sm font-semibold bg-transparent rounded-lg hover:bg-gray-100 transition-colors"
                                href="?lang=en">English</a>
                            <a class="block px-4 py-2 mt-1 text-sm font-semibold bg-transparent rounded-lg hover:bg-gray-100 transition-colors"
                                href="?lang=fr">Français</a>

<div class="bg-cream h-screen flex flex-col justify-center">

            <div class="text-center pb-16 pt-5">
                <label class="text-gray-300 font-semibold">Subscribe to get our Newsletter</label>

            <div class="flex items-center text-gray-400 text-sm justify-center">

            <div class="text-center text-white">
                <p class="my-3 text-gray-400 text-sm">&copy; 2021 Toolshuntr Inc. </p>

    <!-- AOS init -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
